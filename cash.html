<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消費代金券管理系統</title>
    <link rel="apple-touch-icon" href="https://i.postimg.cc/YqdC6WdJ/voucher.jpg">
    <meta name="apple-mobile-web-app-title" content="代金券管理">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        :root {
            --boc-red: #B31F24;
            --taifung-gold: #D4AF37; /* 大豐銀行的金色調 */
            --taifung-red: #C8102E;  /* 大豐銀行常用的紅色搭配 */
            --icbc-red: #C7000B;
            --mpay-orange: #FF8200;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f6f8fb 0%, #e9eff5 100%);
            min-height: 100vh;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .bank-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .bank-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.1);
        }

        .qty-input::-webkit-inner-spin-button,
        .qty-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* 銀行標誌背景色 */
        .logo-中國銀行 { background-color: var(--boc-red); }
        .logo-大豐銀行 { background-color: var(--taifung-gold); }
        .logo-工商銀行 { background-color: var(--icbc-red); }
        .logo-MPay { background-color: var(--mpay-orange); }

        .btn-hover-effect {
            position: relative;
            overflow: hidden;
        }
        .btn-hover-effect:active::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-5xl mx-auto">
        <!-- Header Section -->
        <header class="glass-header rounded-3xl shadow-xl p-8 mb-10 relative overflow-hidden">
            <div class="relative z-10 flex flex-col md:flex-row md:items-center md:justify-between gap-6">
                <div>
                    <h1 class="text-3xl font-black text-gray-900 tracking-tight">消費代金券錢包</h1>
                    <p class="text-gray-500 mt-1 font-medium italic">Voucher Wallet Manager</p>
                </div>
                <div class="bg-white/50 backdrop-blur-md rounded-2xl p-4 border border-white/60 shadow-inner text-right">
                    <span class="text-sm font-bold text-gray-400 uppercase tracking-widest block">當前資產總計</span>
                    <span class="text-4xl font-black text-blue-600" id="totalValueDisplay">MOP 0</span>
                </div>
            </div>
            <div class="absolute -right-20 -top-20 w-64 h-64 bg-blue-100 rounded-full blur-3xl opacity-50"></div>
        </header>

        <!-- Main Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="bankGrid">
            <!-- 動態生成卡片 -->
        </div>

        <!-- Float Actions Bar -->
        <div class="fixed bottom-8 left-1/2 transform -translate-x-1/2 w-full max-w-md px-4 z-40">
            <div class="bg-gray-900/95 backdrop-blur-lg rounded-2xl p-3 shadow-2xl flex gap-3 border border-white/10">
                <button onclick="saveData()" class="btn-hover-effect flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-6 rounded-xl transition-all flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    儲存現況
                </button>
                <button onclick="confirmReset()" class="bg-white/10 hover:bg-red-500 hover:text-white text-gray-300 font-bold py-4 px-6 rounded-xl transition-all flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    重置
                </button>
            </div>
        </div>

        <div class="h-24"></div>
    </div>

    <!-- Notification system -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-8 py-4 rounded-2xl shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-50 flex items-center gap-3">
        <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
        <span id="toastMsg" class="font-medium"></span>
    </div>

    <!-- Enhanced Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-[100] p-6">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mb-6 mx-auto text-red-600">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-2xl font-bold text-gray-900 text-center">確定要全部清零？</h3>
            <p class="text-gray-500 mt-3 text-center leading-relaxed">這將會清除所有本地紀錄。</p>
            <div class="mt-8 grid grid-cols-2 gap-4">
                <button onclick="closeModal()" class="px-4 py-3 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold rounded-2xl">取消</button>
                <button onclick="resetData()" class="px-4 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-2xl">確認</button>
            </div>
        </div>
    </div>

    <script>
        const banks = [
            { 
                name: "中國銀行", 
                color: "#B31F24", 
                logo: `<circle cx="12" cy="12" r="9" stroke="white" stroke-width="2" fill="none"/><rect x="11" y="6" width="2" height="12" fill="white"/><rect x="6" y="11" width="12" height="2" fill="white"/>` 
            },
            { 
                name: "大豐銀行", 
                color: "#D4AF37", 
                logo: `<path d="M12 2L4 7V17L12 22L20 17V7L12 2Z" fill="#C8102E" stroke="white" stroke-width="1.5"/><path d="M12 6V18M8 12H16" stroke="white" stroke-width="2" stroke-linecap="round"/>` 
            },
            { 
                name: "工商銀行", 
                color: "#C7000B", 
                logo: `<circle cx="12" cy="12" r="8" stroke="white" stroke-width="2" fill="none"/><path d="M8 12H16M12 8V16" stroke="white" stroke-width="2" stroke-linecap="round"/>` 
            },
            { 
                name: "MPay", 
                color: "#FF8200", 
                logo: `<path d="M6 16V8L12 14L18 8V16" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` 
            }
        ];
        const denominations = [10, 20, 50];
        let voucherData = {};

        function loadData() {
            const saved = localStorage.getItem('voucher_manager_data_v2');
            if (saved) {
                voucherData = JSON.parse(saved);
            } else {
                banks.forEach(b => {
                    voucherData[b.name] = { 10: 0, 20: 0, 50: 0 };
                });
            }
            renderUI();
        }

        function renderUI() {
            const grid = document.getElementById('bankGrid');
            grid.innerHTML = '';
            let grandTotal = 0;

            banks.forEach(bankObj => {
                const bank = bankObj.name;
                const bankTotal = (voucherData[bank][10] * 10) + (voucherData[bank][20] * 20) + (voucherData[bank][50] * 50);
                grandTotal += bankTotal;

                const card = document.createElement('div');
                card.className = `bank-card bg-white rounded-3xl shadow-sm p-6 overflow-hidden relative`;
                
                let inputsHtml = denominations.map(d => `
                    <div class="flex items-center justify-between py-3 border-b border-gray-50 last:border-0">
                        <div class="flex items-center gap-3">
                            <span class="text-lg font-bold text-gray-700">MOP ${d}</span>
                        </div>
                        <div class="flex items-center bg-gray-50 rounded-xl p-1 border border-gray-100">
                            <button onclick="changeQty('${bank}', ${d}, -1)" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-gray-900 transition-colors text-xl font-bold">-</button>
                            <input type="number" 
                                   value="${voucherData[bank][d]}" 
                                   onchange="updateQty('${bank}', ${d}, this.value)"
                                   class="qty-input w-12 bg-transparent text-center font-black text-blue-600 border-none outline-none focus:ring-0 text-lg"
                            >
                            <button onclick="changeQty('${bank}', ${d}, 1)" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-gray-900 transition-colors text-xl font-bold">+</button>
                        </div>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center logo-${bank} shadow-lg">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    ${bankObj.logo}
                                </svg>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold text-gray-800">${bank}</h2>
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter">Verified Provider</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-bold text-gray-400">小計</p>
                            <p class="text-2xl font-black text-gray-900">$${bankTotal}</p>
                        </div>
                    </div>
                    <div class="space-y-1">
                        ${inputsHtml}
                    </div>
                    <div class="absolute top-0 right-0 w-24 h-24 bg-gray-50 rounded-full -mr-12 -mt-12 opacity-50 z-0"></div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('totalValueDisplay').innerText = `MOP ${grandTotal.toLocaleString()}`;
        }

        function updateQty(bank, den, val) {
            let num = Math.max(0, parseInt(val) || 0);
            voucherData[bank][den] = num;
            renderUI();
        }

        function changeQty(bank, den, delta) {
            voucherData[bank][den] = Math.max(0, voucherData[bank][den] + delta);
            renderUI();
        }

        function saveData() {
            localStorage.setItem('voucher_manager_data_v2', JSON.stringify(voucherData));
            showToast("數據已成功保存");
        }

        function confirmReset() {
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('confirmModal').classList.add('hidden');
        }

        function resetData() {
            banks.forEach(b => {
                voucherData[b.name] = { 10: 0, 20: 0, 50: 0 };
            });
            localStorage.removeItem('voucher_manager_data_v2');
            renderUI();
            closeModal();
            showToast("所有紀錄已清空");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 20px)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 0)';
            }, 2500);
        }

        window.onload = loadData;
    </script>
</body>
</html>
