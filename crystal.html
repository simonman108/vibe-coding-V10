<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消費代金券記錄助手</title>
    <link rel="apple-touch-icon" href="https://i.postimg.cc/YqdC6WdJ/voucher.jpg">
    <meta name="apple-mobile-web-app-title" content="代金券管理">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定義顏色主題 */
        .theme-boc { border-top: 5px solid #e60012; } /* 中國銀行 - 紅 */
        .theme-icbc { border-top: 5px solid #005bac; } /* 工商銀行 - 藍 */
        .theme-mpay { border-top: 5px solid #f37021; } /* Mpay - 橙 */
        .theme-tfb { border-top: 5px solid #ffcc00; } /* 大豐銀行 - 黃 */
        .theme-uepay { border-top: 5px solid #00aeef; } /* UePay - 淺藍 */
        .theme-alipay { border-top: 5px solid #00a0e9; } /* 支付寶 - 藍 */

        .btn-boc { background-color: #e60012; }
        .btn-tfb { background-color: #ffcc00; color: #333; }
        .btn-icbc { background-color: #005bac; }
        .btn-mpay { background-color: #f37021; }
        .btn-uepay { background-color: #00aeef; }
        .btn-alipay { background-color: #00a0e9; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        /* 優化滾動體驗 */
        .card-container {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 pb-32">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">消費代金券記錄助手</h1>
            <p class="text-gray-600 mt-2">隨時管理您的各行代金券庫存</p>
        </header>

        <!-- 總計顯示區 -->
        <div class="bg-gradient-to-r from-gray-800 to-gray-700 rounded-2xl shadow-xl p-6 mb-8 text-white text-center">
            <div class="flex flex-col items-center">
                <span class="text-gray-300 text-sm mb-1 uppercase tracking-wider">所有項目代金券總額</span>
                <div class="flex items-baseline">
                    <span class="text-2xl mr-1 font-light">MOP</span>
                    <span id="total-sum" class="text-5xl font-black tabular-nums">0</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 中國銀行 -->
            <div class="bg-white rounded-xl shadow-md p-6 theme-boc">
                <div class="flex items-center mb-4">
                    <div class="w-3 h-3 rounded-full btn-boc mr-2"></div>
                    <h2 class="text-xl font-bold text-gray-800">中國銀行</h2>
                </div>
                <div class="space-y-3" id="boc-group"></div>
            </div>

            <!-- 工商銀行 -->
            <div class="bg-white rounded-xl shadow-md p-6 theme-icbc">
                <div class="flex items-center mb-4">
                    <div class="w-3 h-3 rounded-full btn-icbc mr-2"></div>
                    <h2 class="text-xl font-bold text-gray-800">工商銀行</h2>
                </div>
                <div class="space-y-3" id="icbc-group"></div>
            </div>

            <!-- Mpay -->
            <div class="bg-white rounded-xl shadow-md p-6 theme-mpay">
                <div class="flex items-center mb-4">
                    <div class="w-3 h-3 rounded-full btn-mpay mr-2"></div>
                    <h2 class="text-xl font-bold text-gray-800">Mpay</h2>
                </div>
                <div class="space-y-3" id="mpay-group"></div>
            </div>
			
            <!-- 大豐銀行 -->
            <div class="bg-white rounded-xl shadow-md p-6 theme-tfb">
                <div class="flex items-center mb-4">
                    <div class="w-3 h-3 rounded-full btn-tfb mr-2"></div>
                    <h2 class="text-xl font-bold text-gray-800">大豐銀行</h2>
                </div>
                <div class="space-y-3" id="tfb-group"></div>
            </div>

            <!-- UePay (添加在支付寶左邊) -->
            <div class="bg-white rounded-xl shadow-md p-6 theme-uepay">
                <div class="flex items-center mb-4">
                    <div class="w-3 h-3 rounded-full btn-uepay mr-2"></div>
                    <h2 class="text-xl font-bold text-gray-800">UePay</h2>
                </div>
                <div class="space-y-3" id="uepay-group"></div>
            </div>

            <!-- 支付寶 -->
            <div class="bg-white rounded-xl shadow-md p-6 theme-alipay">
                <div class="flex items-center mb-4">
                    <div class="w-3 h-3 rounded-full btn-alipay mr-2"></div>
                    <h2 class="text-xl font-bold text-gray-800">支付寶</h2>
                </div>
                <div class="space-y-3" id="alipay-group"></div>
            </div>

        </div>

        <!-- 底部控制欄 -->
        <div class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md shadow-lg border-t p-4 flex justify-center space-x-4 z-50">
            <button onclick="saveData()" class="px-8 py-3 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700 transition-colors shadow-lg active:scale-95">
                儲存資料
            </button>
            <button onclick="confirmReset()" class="px-8 py-3 bg-white border border-gray-300 text-gray-700 font-bold rounded-xl hover:bg-gray-50 transition-colors shadow-sm active:scale-95">
                重置清零
            </button>
        </div>
    </div>

    <!-- 訊息提示框 -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 px-6 py-3 bg-gray-900 text-white rounded-full shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-[100]">
        資料已儲存
    </div>

    <script>
        const banks = [
            { id: 'boc', name: '中國銀行', colorClass: 'btn-boc' },
            { id: 'icbc', name: '工商銀行', colorClass: 'btn-icbc' },
            { id: 'mpay', name: 'Mpay', colorClass: 'btn-mpay' },
            { id: 'tfb', name: '大豐銀行', colorClass: 'btn-tfb' },
            { id: 'uepay', name: 'UePay', colorClass: 'btn-uepay' },
            { id: 'alipay', name: '支付寶', colorClass: 'btn-alipay' }
        ];
        // 面額清單
        const amounts = [10, 20, 50, 100, 200];

        // 初始化頁面結構
        function initUI() {
            banks.forEach(bank => {
                const container = document.getElementById(`${bank.id}-group`);
                if (!container) return;
                
                amounts.forEach(amount => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between bg-gray-50 p-2 px-3 rounded-lg border border-transparent hover:border-gray-200 transition-all';
                    row.innerHTML = `
                        <span class="font-medium text-gray-600">${amount} 元</span>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeVal('${bank.id}', ${amount}, -1)" class="w-8 h-8 rounded-lg border bg-white flex items-center justify-center hover:bg-gray-100 active:bg-gray-200 transition-colors">-</button>
                            <input type="number" id="${bank.id}-${amount}" value="0" min="0" 
                                class="w-12 text-center bg-transparent font-bold text-lg outline-none text-gray-800"
                                oninput="handleInput(this)">
                            <button onclick="changeVal('${bank.id}', ${amount}, 1)" class="w-8 h-8 rounded-lg ${bank.colorClass} ${bank.id === 'tfb' ? 'text-gray-800' : 'text-white'} flex items-center justify-center shadow-sm hover:opacity-90 active:scale-90 transition-all">+</button>
                        </div>
                    `;
                    container.appendChild(row);
                });
            });
            loadData();
        }

        // 修改數值
        function changeVal(bankId, amount, delta) {
            const input = document.getElementById(`${bankId}-${amount}`);
            let val = parseInt(input.value) || 0;
            val = Math.max(0, val + delta);
            input.value = val;
            calculateTotal();
        }

        // 處理手動輸入
        function handleInput(input) {
            if (input.value < 0 || input.value === "") input.value = 0;
            calculateTotal();
        }

        // 計算總額
        function calculateTotal() {
            let grandTotal = 0;
            banks.forEach(bank => {
                amounts.forEach(amount => {
                    const element = document.getElementById(`${bank.id}-${amount}`);
                    if (element) {
                        const count = parseInt(element.value) || 0;
                        grandTotal += (count * amount);
                    }
                });
            });
            
            // 動態更新數字
            const totalDisplay = document.getElementById('total-sum');
            totalDisplay.innerText = grandTotal.toLocaleString();
        }

        // 儲存到 Local Storage
        function saveData() {
            const data = {};
            banks.forEach(bank => {
                data[bank.id] = {};
                amounts.forEach(amount => {
                    const element = document.getElementById(`${bank.id}-${amount}`);
                    if (element) {
                        data[bank.id][amount] = element.value;
                    }
                });
            });
            localStorage.setItem('voucher_tracker_data', JSON.stringify(data));
            showToast('資料已成功儲存');
        }

        // 從 Local Storage 讀取
        function loadData() {
            const saved = localStorage.getItem('voucher_tracker_data');
            if (saved) {
                const data = JSON.parse(saved);
                banks.forEach(bank => {
                    if (data[bank.id]) {
                        amounts.forEach(amount => {
                            const element = document.getElementById(`${bank.id}-${amount}`);
                            if (element && data[bank.id][amount] !== undefined) {
                                element.value = data[bank.id][amount];
                            }
                        });
                    }
                });
            }
            calculateTotal();
        }

        // 重置功能
        function confirmReset() {
            if (window.confirm('確定要清空所有資料並重置為 0 嗎？')) {
                banks.forEach(bank => {
                    amounts.forEach(amount => {
                        const element = document.getElementById(`${bank.id}-${amount}`);
                        if (element) element.value = 0;
                    });
                });
                localStorage.removeItem('voucher_tracker_data');
                calculateTotal();
                showToast('資料已全部清零');
            }
        }

        // 提示訊息
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.replace('opacity-0', 'opacity-100');
            toast.classList.add('top-10');
            setTimeout(() => {
                toast.classList.replace('opacity-100', 'opacity-0');
                toast.classList.remove('top-10');
            }, 2000);
        }

        window.onload = initUI;
    </script>
</body>
</html>
